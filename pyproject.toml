[project]
name = "rsil"
version = "0.1.0"
description = "RON Sports Intelligence Lab: provider-neutral historical football corpus"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pyarrow>=15"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
